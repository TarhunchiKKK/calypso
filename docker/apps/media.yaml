services:
  media-slq-db:
    container_name: media-slq-db
    image: postgres:15.2
    restart: always
    environment:
      - POSTGRES_DB=${MEDIA_SERVICE_SQL_DB_NAME}
      - POSTGRES_USER=${MEDIA_SERVICE_SQL_DB_USER}
      - POSTGRES_PASSWORD=${MEDIA_SERVICE_SQL_DB_PASS}
    ports:
      - ${MEDIA_SERVICE_SQL_DB_PORT}:5432
    volumes:
      - media-sql-db-data:/var/lib/postgresql/data
    networks:
      - api-network

  media-cache:
    container_name: media-cache
    image: redis:5.0
    restart: always
    ports:
      - ${MEDIA_SERVICE_REDIS_PORT}:6379
    volumes:
      - media-cache-data:/data
    networks:
      - api-network

  media-service:
    image: calypso-media:latest
    container_name: media-service
    build:
      context: ../../
      dockerfile: ./docker/Dockerfile
      args:
        - APP_NAME=media
    env_file:
      - ../../.env
      - ../../apps/media/.env
    depends_on:
      - media-sql-db
      - media-cache
    networks:
      - api-network

volumes:
  media-sql-db-data:
  media-cache-data:

networks:
  api-network:
    external: true
    name: api-network
