services:
  gateway-slq-db:
    container_name: gateway-slq-db
    image: postgres:15.2
    restart: always
    environment:
      - POSTGRES_DB=${SQL_DB_NAME}
      - POSTGRES_USER=${SQL_DB_USER}
      - POSTGRES_PASSWORD=${SQL_DB_PASS}
    ports:
      - ${SQL_DB_PORT}:5432
    volumes:
      - gateway-sql-db-data:/var/lib/postgresql/data
    networks:
      - api-network

  gateway-cache:
    container_name: gateway-cache
    image: redis:5.0
    restart: always
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - gateway-cache-data:/data
    networks:
      - api-network

  gateway:
    image: calypso-gateway:latest
    container_name: gateway
    build:
      context: ../../
      dockerfile: ./docker/Dockerfile
      args:
        - APP_NAME=gateway
    ports:
      - "3000:${APP_PORT}"
    env_file:
      - ../../.env
      - ../../apps/gateway/.env
    depends_on:
      - gateway-sql-db
      - gateway-cache
    networks:
      - api-network

volumes:
  gateway-sql-db-data:
  gateway-cache-data:

networks:
  api-network:
    external: true
    name: api-network
