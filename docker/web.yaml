services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - ${MINIO_API_PORT}:9000 
      - ${MINIO_UI_PORT}:9001 
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS} 
    volumes:
      - ../data/minio:/data 
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
