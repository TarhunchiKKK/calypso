services:
    gateway:
        container_name: gateway
        image: calypso/gateway:latest
        build:
            context: ..
            dockerfile: apps/gateway/Dockerfile
            args:
                APP_PORT: ${GATEWAY_SERVICE_APP_PORT}
        env_file:
            - ../apps/gateway/.env
        ports:
            - ${GATEWAY_SERVICE_APP_PORT}:${GATEWAY_SERVICE_APP_PORT}
        restart: unless-stopped

