version: "3.7"

services:
  web:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    ports: 
      - 3000:3000
    depends_on:
      - api

  postgres:
    container_name: postgres-db
    image: postgres:15.2
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
