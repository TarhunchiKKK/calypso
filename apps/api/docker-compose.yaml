services:
  slq-db:
    container_name: slq-db
    image: postgres:15.2
    restart: always
    environment:
      - POSTGRES_DB=${SQL_DB_NAME}
      - POSTGRES_USER=${SQL_DB_USER}
      - POSTGRES_PASSWORD=${SQL_DB_PASS}
    ports:
      - ${SQL_DB_PORT}:5432
    volumes:
      - sql-db-data:/var/lib/postgresql/data

  nosql-db:
    container_name: nosql-db
    image: mongo:7.0
    environment:
      - MONGO_INITDB_DATABASE=${NOSQL_DB_NAME}
    ports:
      - ${NOSQL_DB_PORT}:27017

  cache:
    container_name: cache
    image: redis:5.0
    restart: always
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - cache-data:/data
  
  s3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: s3
    volumes:
      - ../data/minio:/data
    ports:
      - ${S3_PORT}:9000
      - ${S3_UI_PORT}:9001
    environment:
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY}
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  sql-db-data:
  cache-data:
