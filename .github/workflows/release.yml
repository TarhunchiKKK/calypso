name: Release

on:
    push:
        branches:
            - "main"

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1

            - name: Install dependencies
              run: bun install

            - name: Format
              run: bun format:check

            - name: Lint
              run: bun lint

            - name: Knip
              run: bun knip

            - name: Build
              run: bun build

            - name: Unit-tests
              run: bun test:unit
