name: Format

on:
    push:
        branches-ignore:
            - "main"

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1

            - name: Install dependencies
              run: bun install-deps
            
            - name: Build common
              run: bun build:common
            
            - name: Type check in api
              run: bun type-check:api

            - name: Type check in web
              run: bun type-check:web