name: Unit-testing

on:
    pull_request:
        types: [opened, reopened]

jobs:
    test:
        runs-on: ubuntu-latest
        if: contains(github.head_ref, 'test/')
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1

            - name: Install dependencies
              run: bun install

            - name: Unit-tests
              run: bun test:unit
