name: Lint

on:
    workflow_dispatch: 

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1

            - name: Install dependencies
              run: bun install-deps
            
            - name: Build common
              run: bun build:common

            - name: Knip
              run: bun knip
