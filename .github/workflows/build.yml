name: Build

on:
    pull_request:
        types: [opened, reopened]

jobs:
    api:
        runs-on: ubuntu-latest
        if: contains(github.head_ref, '/api/')
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1

            - name: Install dependencies
              run: bun install-deps
            
            - name: Build common
              run: bun build:common

            - name: Build
              run: bun build:api
              
    web:
        runs-on: ubuntu-latest
        if: contains(github.head_ref, '/web/')
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1

            - name: Install dependencies
              run: bun install-deps
            
            - name: Build common
              run: bun build:common

            - name: Build
              run: bun build:web
