version: "3.7"

services:
  web:
    build:
      context: ./apps/web
    ports: 
      - 3000:3000
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
    ports: 
      - ${API_PORT}:3000
    depends_on:
      - postgres
      - mong-db

  postgres:
    container_name: postgres-db
    image: postgres:15.2
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo-db:
    container_name: mongo-db
    image: mongo:latest
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME}
    ports:
      - ${MONGO_DB_PORT}:27017

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
        - ${RABBIT_MQ_PORT}:5672
        - 15672:15672

volumes:
  postgres_data:
