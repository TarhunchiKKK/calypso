syntax = "proto3";

package media;


message MediaGrpc {
    string id = 1;

    string url = 2;
}

message MediaGroupGrpc {
    string id = 1;

    string title = 2;

    string thumbnail = 3;
}

message MediaListGrpc {
    repeated MediaGrpc media = 1;
}

message MediaGroupsListGrpc {
    repeated MediaGroupGrpc groups = 1;
}

message PresignUrlPairGrpc {
    string key = 1;

    string url = 2; 
}
