syntax = "proto3";

package boards;


message BoardGrpc {
  string id = 1;

  string title = 2;

  optional string description = 3;

  string icon = 4;

  string creatorId = 5;

  string createdAt = 6;

  optional string updatedAt = 7;
}

message BoardsListGrpc {
    repeated BoardGrpc boards = 1;
}
