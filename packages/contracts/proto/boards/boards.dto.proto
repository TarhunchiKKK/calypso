syntax = "proto3";

import "common/util.proto";
import "boards/boards.models.proto";

package boards;


message BoardGrpcResponse {
  oneof response {
    BoardGrpc data = 1;

    common.GrpcError error = 2;
  }
}

message CreateBoardGrpcRequest {
  string title = 1;

  string icon = 2;

  string creatorId = 3;
}

message UpdateBoardGrpcRequest {
  string id = 1;

  string userId = 2;

  optional string title = 3;

  optional string description = 4;

  optional string icon = 5;
}

message FindAllBoardsGrpcResponse {
    oneof response {
        BoardsListGrpc data = 1;

        common.GrpcError error = 2;
    }
}
