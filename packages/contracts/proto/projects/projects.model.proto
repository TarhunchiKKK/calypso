syntax = "proto3";

package projects;


message ProjectCreatorGrpc {
    string id = 1;

    string username = 2;

    string email = 3;

    optional string avatar = 4;
}

message ProjectGrpc {
  string id = 1;

  string title = 2;

  optional string description = 3;

  string thumbnail = 4;

  ProjectCreatorGrpc creator = 5;

  string createdAt = 6;

  optional string updatedAt = 7;
}

message FindProjectsFiltersGrpc {
   optional string type = 1;

   optional string title = 2;

   optional string creatorId = 3;

   optional string sortOrder = 4;
}
