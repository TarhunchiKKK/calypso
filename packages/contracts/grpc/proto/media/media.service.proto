syntax = "proto3";

import "media/media.dto.proto";

package media;


service MediaService {
    rpc FindPresets(FindMediaPresetsGrpcRequest) returns (FindMediaPresetsGrpcResponse) {}

    rpc FindGroups(FindMediaPresetsGroupsGrpcRequest) returns (FindMediaPresetsGroupsGrpcResponse) {}

    rpc GetPresignedUrl(GetPresignedMediaUrlGrpcRequest) returns (GetPresignedMediaUrlGrpcResponse) {}
}
