syntax = "proto3";

import "common.proto";

package media;

service MediaService {
    rpc FindPresets(FindMediaPresetsGrpcRequest) returns (FindMediaPresetsGrpcResponse) {}

    rpc FindGroups(FindMediaPresetsGroupsGrpcRequest) returns (FindMediaPresetsGroupsGrpcResponse) {}

    rpc GetPresignedUrl(GetPresignedMediaUrlGrpcRequest) returns (GetPresignedMediaUrlGrpcResponse) {}
} 

message MediaGrpc {
    string id = 1;

    string url = 2;
}

message MediaGroupGrpc {
    string id = 1;

    string title = 2;

    string thumbnail = 3;
}

message MediaListGrpc {
    repeated MediaGrpc media = 1;
}

message MediaGroupsListGrpc {
    repeated MediaGroupGrpc groups = 1;
}

message FindMediaPresetsGrpcRequest {
    string domain = 1;

    optional string groupId = 2; 
}

message FindMediaPresetsGrpcResponse {
    oneof response {
        MediaListGrpc data = 1;

        common.GrpcError error = 2;
    }
}

message FindMediaPresetsGroupsGrpcRequest {
    string domain = 1;
}

message FindMediaPresetsGroupsGrpcResponse {
    oneof response {
        MediaGroupsListGrpc data = 1;

        common.GrpcError error = 2;
    }
}

message GetPresignedMediaUrlGrpcRequest {
    string fileName = 1;

    string contentType = 2;
}

message PresignUrlPairGrpc {
    string key = 1;

    string url = 2; 
}

message GetPresignedMediaUrlGrpcResponse {
    oneof response {
        PresignUrlPairGrpc data = 1;

        common.GrpcError error = 2;
    }
}