syntax = "proto3";

import "google/protobuf/empty.proto"; 

package common;

message ErrorResponse {
    repeated string message = 1;

    string error = 2;

    int32 statusCode = 3;
}


message EmptyResponse {
    oneof response {
        google.protobuf.Empty data = 1;

        common.ErrorResponse error = 2;
    }
}

message Rect {
    float x = 1;

    float y = 2;

    float width = 3;

    float height = 4;
}