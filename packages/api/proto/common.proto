syntax = "proto3";

import "google/protobuf/empty.proto"; 

package common;

message GrpcError {
    repeated string message = 1;

    string error = 2;

    int32 statusCode = 3;
}


message EmptyGrpcResponse {
    oneof response {
        google.protobuf.Empty data = 1;

        common.GrpcError error = 2;
    }
}
