syntax = "proto3";

package projects;

message ProjectCreatorGrpc {
    string id = 1;

    string username = 2;

    string email = 3;

    optional string avatar = 4;
}

message DuplicateProjectGrpcRequest {
    string id = 1;

    string title = 2;

    string creatorId = 3; 
}

message FindAllProjectsGrpcRequest {
    string userId = 1;
}

message FindOneProjectGrpcRequest {
    string id = 1;

    string userId = 2;
}

message RemoveProjectGrpcRequest {
    string id = 1;

    string userId = 2;
}